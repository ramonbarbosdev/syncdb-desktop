name: Release macOS

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.platform.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: platform
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: bash .github/scripts/release-platform-check.sh mac

  release-macos:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Electron
        uses: actions/checkout@v4
        with:
          path: syncdb-desktop
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: ramonbarbosdev/app-sincdb
          path: app-sincdb
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: ramonbarbosdev/api-sincdb
          path: api-sincdb
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            syncdb-desktop/package-lock.json
            app-sincdb/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create CI build config
        run: |
          cat > syncdb-desktop/build.config.json <<'JSON'
          {
            "frontPath": "../app-sincdb",
            "apiPath": "../api-sincdb",
            "angularDistPath": "dist/browser",
            "jarName": "syncdb.jar"
          }
          JSON

      - name: Install Electron dependencies
        working-directory: syncdb-desktop
        run: npm ci

      - name: Resolve release tag
        id: release_tag
        working-directory: syncdb-desktop
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package version
        working-directory: syncdb-desktop
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ steps.release_tag.outputs.name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Versao do package.json ($PACKAGE_VERSION) diferente da tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Prepare macOS JRE
        run: |
          mkdir -p syncdb-desktop/jres/macos

          if [[ "$JAVA_HOME" == */Contents/Home ]]; then
            cp -R "$(dirname "$(dirname "$JAVA_HOME")")" syncdb-desktop/jres/macos/
          else
            cp -R "$JAVA_HOME"/. syncdb-desktop/jres/macos/
          fi

      - name: Fix Maven Wrapper permission
        run: chmod +x api-sincdb/mvnw

      - name: Prepare release
        working-directory: syncdb-desktop
        run: npm run prepare:release

      - name: Verificar frontend embutido
        working-directory: syncdb-desktop
        run: |
          test -f dist/browser/index.html || { echo "dist/browser/index.html ausente"; exit 1; }
          ls dist/browser/main-*.js | head -1

      - name: Build macOS release
        working-directory: syncdb-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Validate macOS artifacts
        working-directory: syncdb-desktop
        run: |
          ZIP_FILE="$(find release -maxdepth 1 -name '*.zip' | head -n 1)"
          DMG_FILE="$(find release -maxdepth 1 -name '*.dmg' | head -n 1)"

          test -n "$ZIP_FILE" || (echo "ZIP do macOS nao encontrado" && exit 1)
          test -n "$DMG_FILE" || (echo "DMG do macOS nao encontrado" && exit 1)

          APP_BUNDLE="$(find release -maxdepth 3 -name '*.app' | head -n 1)"
          test -n "$APP_BUNDLE" || (echo ".app do macOS nao encontrado" && exit 1)
          test -f "$APP_BUNDLE/Contents/Resources/icon.icns" \
            || test -f "$APP_BUNDLE/Contents/Resources/electron.icns" \
            || (echo "ICNS ausente no bundle do app" && exit 1)

      - name: Publish macOS release assets
        working-directory: syncdb-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob

          RELEASE_TAG="${{ steps.release_tag.outputs.name }}"

          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG"

          gh release upload "$RELEASE_TAG" \
            release/*.dmg \
            release/*.zip \
            release/*.blockmap \
            --clobber