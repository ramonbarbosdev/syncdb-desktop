name: Release Windows

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.platform.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: platform
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: bash .github/scripts/release-platform-check.sh win

  release-windows:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Electron
        uses: actions/checkout@v4
        with:
          path: syncdb-desktop
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: ramonbarbosdev/app-sincdb
          path: app-sincdb
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: ramonbarbosdev/api-sincdb
          path: api-sincdb
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            syncdb-desktop/package-lock.json
            app-sincdb/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create CI build config
        shell: pwsh
        run: |
          @'
          {
            "frontPath": "../app-sincdb",
            "apiPath": "../api-sincdb",
            "angularDistPath": "dist/browser",
            "jarName": "syncdb.jar"
          }
          '@ | Set-Content -Path "syncdb-desktop/build.config.json" -Encoding UTF8

      - name: Install Electron dependencies
        working-directory: syncdb-desktop
        run: npm ci

      - name: Prepare Windows JRE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path syncdb-desktop/jres/windows | Out-Null
          Copy-Item -Path "$env:JAVA_HOME\*" -Destination "syncdb-desktop/jres/windows" -Recurse

      - name: Prepare release
        working-directory: syncdb-desktop
        run: npm run prepare:release

      - name: Verificar frontend embutido
        working-directory: syncdb-desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/browser/index.html")) {
            Write-Error "dist/browser/index.html ausente — o instalador ficaria sem Angular."
            exit 1
          }
          $main = Get-ChildItem -Path "dist/browser" -Filter "main-*.js" -File | Select-Object -First 1
          if (-not $main) {
            Write-Error "Nenhum main-*.js em dist/browser."
            exit 1
          }
          Write-Host "Frontend OK: $($main.Name)"

      - name: Build and publish Windows release
        working-directory: syncdb-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Verificar artefatos do updater (Windows)
        working-directory: syncdb-desktop
        shell: pwsh
        run: |
          if (-not (Test-Path "release/latest.yml")) {
            Write-Error "latest.yml nao foi gerado em release/ — auto-updater do Windows ficara quebrado."
            exit 1
          }
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Nenhum instalador .exe encontrado em release/."
            exit 1
          }
          Write-Host "Artefatos do updater OK: latest.yml e $($installer.Name)"
